[package]
name = "andpull"
version = "0.1.0"
edition = "2021"
description = "Blazingly fast ADB media pull tool with TUI"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Serialization (state/resume)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Byte formatting
bytesize = "2"
glob = "0.3.3"

# Fast hashing for deduplication & integrity checks
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# File mtime preservation
filetime = "0.2"

# Host disk space preflight (libc::statfs)
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
